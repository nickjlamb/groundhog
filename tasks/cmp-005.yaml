id: cmp-005
category: us_uk_comparison
prompt: >
  The UK SmPC for domperidone contraindicates co-administration with potent
  CYP3A4 inhibitors. Does the US Prescribing Information for domperidone carry
  the same contraindication?
answer_type: comparison
gold:
  differs: null
