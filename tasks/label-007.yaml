  recommended dose for a patient with HER2-low metastatic breast cancer?
answer_type: exact_value
gold:
  value: "5.4 mg/kg every 3 weeks"
  unit: "mg/kg"
  acceptable_variants: ["5.4 mg/kg IV once every 3 weeks (21-day cycle)", "5.4 mg/kg q3w"]
source:
  tool: get_smpc
