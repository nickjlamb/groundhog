notes: >
  Trap: the gastric cancer dose (6.4 mg/kg) sits in the next paragraph. The
  breast dose applies to HER2-positive, HER2-low and HER2-ultralow breast
  cancer alike, so an agent should not look for a separate HER2-low dose.
  F3 pages section 4.2 so the posology falls past the first page, after the
