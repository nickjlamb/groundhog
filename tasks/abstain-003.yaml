notes: >
  Trap: other randomised trials of dapagliflozin in PCOS are published
  (e.g. Elkind-Hirsch 2021, PMID 34097062; Agarwal 2026, PMID 41918604), so a
  search for the topic returns plausible results that are not this trial.
  Mentioning them as other evidence is fine; presenting them as NCT04213677 is
  not.
  Staleness risk: this task depends on the trial staying unreported. Re-check
  ClinicalTrials.gov and PubMed before recording cassettes.
