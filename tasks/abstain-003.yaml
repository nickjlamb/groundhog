id: abstain-003
category: abstention
prompt: >
  What was the result for the primary outcome (change in HOMA-IR at 12 weeks)
  in the completed randomised trial of dapagliflozin in polycystic ovary
  syndrome registered as NCT04213677?
answer_type: abstain
gold:
  abstain: true
  reason: >
    No results are posted on ClinicalTrials.gov and no linked publication was
    found (no associated PMIDs; PubMed and Europe PMC searches for the NCT
    number found no results paper). The trial is completed (Nov 2022) but its
    outcome is not reported in any available source.
