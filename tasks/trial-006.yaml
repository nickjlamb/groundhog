id: trial-006
category: trial_facts
prompt: >
  For the trial registered as NCT02065791, what was the primary endpoint, and what was its
  result (effect estimate with its 95% confidence interval where reported)?
answer_type: structured
gold:
  endpoint: "Composite of end-stage kidney disease (dialysis, transplantation or sustained eGFR <15), doubling of serum creatinine, or death from renal or cardiovascular causes"
  result: "43.2 vs 61.2 events per 1000 patient-years; HR 0.70 (95% CI 0.59-0.82); P=0.00001"
  detail: >
    CREDENCE, stopped early after a planned interim analysis. The renal-specific composite (excluding cardiovascular death; HR 0.66) is a secondary outcome.
source:
  tool: get_trial; get_abstract
  nct_id: "NCT02065791"
  pmid: "30990260"
  excerpts:
    registry_primary: "Primary Composite Endpoint of Doubling of Serum Creatinine (DoSC), End-stage Kidney Disease (ESKD), and Renal or Cardiovascular (CV) Death"
    publication_primary: "The primary outcome was a composite of end-stage kidney disease (dialysis, transplantation, or a sustained estimated GFR of <15 ml per minute per 1.73 m), a doubling of the serum creatinine level, or death from renal or cardiovascular causes."
    publication_result: "The relative risk of the primary outcome was 30% lower in the canagliflozin group than in the placebo group, with event rates of 43.2 and 61.2 per 1000 patient-years, respectively (hazard ratio, 0.70; 95% confidence interval [CI], 0.59 to 0.82; P = 0.00001)."
    renal_specific: "The relative risk of the renal-specific composite of end-stage kidney disease, a doubling of the creatinine level, or death from renal causes was lower by 34% (hazard ratio, 0.66; 95% CI, 0.53 to 0.81; P<0.001)"
    stopped: "The trial was stopped early after a planned interim analysis on the recommendation of the data and safety monitoring committee."
  retrieved: 2026-11-06
