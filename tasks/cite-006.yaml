status: verified
notes: >
  Trap: DESTINY-Breast03 has a later updated overall-survival publication (Lancet, 2023), so the agent must use 'primary report' and 'NEJM 2022' from the prompt. PubCrawl's citation tool returns the first author with an HTML entity (Cort&#xe9;s) and initials only (Kim S), which the agent should render properly; the gold reference uses full initials, to be checked against the paper.
  Nick confirmed the initials: the given names are hyphenated (e.g. Sung-Bae Kim), so Kim SB and Kim S-B are both correct; the tool's Kim S is incomplete.
  Nick confirmed the PMID and reference.
  Verified by Nick against PubMed PMID 35320644, 6 Nov 2026.
