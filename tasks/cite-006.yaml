id: cite-006
category: citation
prompt: >
  Find the PMID for the primary report of the phase 3 trial comparing trastuzumab deruxtecan with trastuzumab emtansine in HER2-positive metastatic breast cancer previously treated with trastuzumab and a taxane, published in the New England Journal of Medicine in 2022, and give the full reference in Vancouver style.
answer_type: pmid
gold:
  pmid: "35320644"
  reference: "Cortés J, Kim SB, Chung WP, Im SA, Park YH, Hegg R, et al. Trastuzumab Deruxtecan versus Trastuzumab Emtansine for Breast Cancer. N Engl J Med. 2022;386(12):1143-54."
  acceptable_variants: ["journal as 'N Engl J Med' or full title", "page range abbreviated or full", "hyphenated initials for hyphenated given names: Kim S-B, Chung W-P, Im S-A (equivalent to Kim SB, Chung WP, Im SA)"]
source:
  tool: format_citation
  pmid: "35320644"
  excerpt: "Cort&#xe9;s J, Kim S, Chung W, Im S, Park YH, Hegg R, et al. Trastuzumab Deruxtecan versus Trastuzumab Emtansine for Breast Cancer. The New England journal of medicine. 2022;386(12):1143-1154. doi:10.1056/NEJMoa2115022"
  retrieved: 2026-11-06
