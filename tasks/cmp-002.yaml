id: cmp-002
category: us_uk_comparison
prompt: >
  Do the US Prescribing Information for metformin and the UK SmPC for
  Glucophage (metformin) set different kidney-function thresholds below which
  metformin is contraindicated? Give each threshold.
answer_type: comparison
gold:
  differs: false
  us: "eGFR below 30 mL/min/1.73 m2"
  uk: "GFR < 30 mL/min"
  detail: >
    Same numerical threshold (30). The US expresses it as eGFR normalised to
    body surface area; the UK as GFR in mL/min. Treat as the same threshold.
  accept_if: "states no material difference and gives 30 for both"
source:
  tool: compare_labels
  query: { drug: "metformin", uk_drug: "Glucophage", sections: ["contraindications"] }
  products:
    us: "Metformin (METFORMIN ER 500 MG), DailyMed setid 05999192-ebc6-4198-bd1e-f46abbfb4f8a"
    uk: "Glucophage 500 mg film coated tablets (eMC product 987)"
  excerpts:
    us: "Severe renal impairment (eGFR below 30 mL/min/1.73 m 2 )"
    uk: "Severe renal failure (GFR < 30 mL/min)."
  retrieved: 2026-10-16
fault: F4
status: verified
notes: >
  A control task: the right answer is "no difference". Tests whether agents
  invent differences when asked to compare. Splitting hairs over the units is
  fine in the rationale, but differs must be false.
  The US side matched an extended-release generic; Nick confirmed the
  contraindication is the same across metformin USPIs.
  Verified by Nick, 16 Oct 2026.
  F4 (7 Nov 2026, approved by Nick): the stale variant is the archived DailyMed metformin label
  (Ascend, setid 0ff1ba75, v11, Dec 2013): contraindicated at serum creatinine >=1.5 mg/dL (men) /
  >=1.4 mg/dL (women), the pre-2016 criterion. Current US labels use eGFR <30, matching the UK.
  A different generic labeller from the current recording; the renal wording is class-wide.
