notes: >
  Trap: several near-identical HRs (0.79 kidney-specific, sharing the 0.66
  lower bound; 0.71 CV death; 0.82 MACE; 0.80 all-cause death) and a
  primary endpoint that includes CV death, which an agent can drop.
  Registry checked 27 Nov 2026: endpoint and HR match the paper; the
  registry gives P=0.0001, the paper P=0.0003 (the scorer ignores P values).
  Drafted by Claude, 27 Nov 2026, from the PubMed abstract.
