id: trial-008
split: public
category: trial_facts
prompt: >
  For the trial registered as NCT03819153, what was the primary endpoint, and
  what was its result (effect estimate with its 95% confidence interval where
  reported)?
answer_type: structured
gold:
  endpoint: "Major kidney disease events: composite of kidney failure (dialysis, transplantation or eGFR <15), at least a 50% reduction in eGFR from baseline, or death from kidney-related or cardiovascular causes"
  result: "331 vs 410 first events; HR 0.76 (95% CI 0.66-0.88); P=0.0003"
  detail: >
    FLOW: semaglutide 1.0 mg weekly in type 2 diabetes with chronic kidney
    disease; median follow-up 3.4 years after early stopping for efficacy at
    a prespecified interim analysis.
source:
  tool: get_trial; get_abstract
  nct_id: "NCT03819153"
  pmid: "38785209"
  excerpts:
    publication_primary: "The primary outcome was major kidney disease events, a composite of the onset of kidney failure (dialysis, transplantation, or an eGFR of <15 ml per minute per 1.73 m2), at least a 50% reduction in the eGFR from baseline, or death from kidney-related or cardiovascular causes."
    publication_result: "The risk of a primary-outcome event was 24% lower in the semaglutide group than in the placebo group (331 vs. 410 first events; hazard ratio, 0.76; 95% confidence interval [CI], 0.66 to 0.88; P = 0.0003)."
    registry_result: "Posted result: 331 vs 410; HR 0.76 (95% CI 0.66 to 0.88); P=0.0001"
    other_results: "Results were similar for a composite of the kidney-specific components of the primary outcome (hazard ratio, 0.79; 95% CI, 0.66 to 0.94) and for death from cardiovascular causes (hazard ratio, 0.71; 95% CI, 0.56 to 0.89). ... the risk of major cardiovascular events 18% lower (hazard ratio, 0.82; 95% CI, 0.68 to 0.98; P = 0.029)"
  retrieved: 2026-11-27
