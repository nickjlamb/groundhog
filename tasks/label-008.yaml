notes: >
  Trap: the section opens with the atrial fibrillation dose (5 mg twice daily,
  2.5 mg with dose-reduction criteria), and the 2.5 mg dose for preventing
  recurrence after 6 months follows the PE dose. A good answer gives the
  two-phase schedule, not a single dose. Companion to label-003 (AF dose
  reduction).
