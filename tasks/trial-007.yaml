id: trial-007
split: public
category: trial_facts
prompt: >
  For the trial registered as NCT03619213, what was the primary endpoint, and
  what was its result (effect estimate with its 95% confidence interval where
  reported)?
answer_type: structured
gold:
  endpoint: "Composite of worsening heart failure (unplanned hospitalisation or urgent visit for heart failure) or cardiovascular death"
  result: "16.4% vs 19.5%; HR 0.82 (95% CI 0.73-0.92); P<0.001"
  detail: >
    DELIVER: dapagliflozin in heart failure with LVEF above 40%, median
    follow-up 2.3 years.
source:
  tool: get_trial; get_abstract
  nct_id: "NCT03619213"
  pmid: "36027570"
  excerpts:
    publication_primary: "The primary outcome was a composite of worsening heart failure (which was defined as either an unplanned hospitalization for heart failure or an urgent visit for heart failure) or cardiovascular death, as assessed in a time-to-event analysis."
    publication_result: "Over a median of 2.3 years, the primary outcome occurred in 512 of 3131 patients (16.4%) in the dapagliflozin group and in 610 of 3132 patients (19.5%) in the placebo group (hazard ratio, 0.82; 95% confidence interval [CI], 0.73 to 0.92; P<0.001)."
    components: "Worsening heart failure occurred in 368 patients (11.8%) in the dapagliflozin group and in 455 patients (14.5%) in the placebo group (hazard ratio, 0.79; 95% CI, 0.69 to 0.91); cardiovascular death occurred in 231 patients (7.4%) and 261 patients (8.3%), respectively (hazard ratio, 0.88; 95% CI, 0.74 to 1.05)."
  retrieved: 2026-11-27
