<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Groundhog: right once isn't reliable">
<style>
.r,.eyes{transform-box:fill-box;transform-origin:center}
@keyframes pop1{0%,18.75%{opacity:0;transform:scale(.3)}21.50%{opacity:1;transform:scale(1.12)}23.25%{transform:scale(1)}87.50%{opacity:1;transform:scale(1)}93.75%,100%{opacity:0;transform:scale(.9)}}
.r1{animation:pop1 8.0s infinite}
@keyframes draw1{0%,21.00%{stroke-dashoffset:40}25.00%,100%{stroke-dashoffset:0}}
.c1{stroke-dasharray:40;animation:draw1 8.0s infinite}
@keyframes pop2{0%,24.00%{opacity:0;transform:scale(.3)}26.75%{opacity:1;transform:scale(1.12)}28.50%{transform:scale(1)}87.50%{opacity:1;transform:scale(1)}93.75%,100%{opacity:0;transform:scale(.9)}}
.r2{animation:pop2 8.0s infinite}
@keyframes draw2{0%,26.25%{stroke-dashoffset:40}30.25%,100%{stroke-dashoffset:0}}
.c2{stroke-dasharray:40;animation:draw2 8.0s infinite}
@keyframes pop3{0%,29.25%{opacity:0;transform:scale(.3)}32.00%{opacity:1;transform:scale(1.12)}33.75%{transform:scale(1)}87.50%{opacity:1;transform:scale(1)}93.75%,100%{opacity:0;transform:scale(.9)}}
.r3{animation:pop3 8.0s infinite}
@keyframes draw3{0%,31.50%{stroke-dashoffset:40}35.50%,100%{stroke-dashoffset:0}}
.c3{stroke-dasharray:40;animation:draw3 8.0s infinite}
@keyframes pop4{0%,34.50%{opacity:0;transform:scale(.3)}37.25%{opacity:1;transform:scale(1.12)}39.00%{transform:scale(1)}87.50%{opacity:1;transform:scale(1)}93.75%,100%{opacity:0;transform:scale(.9)}}
.r4{animation:pop4 8.0s infinite}
@keyframes draw4{0%,36.75%{stroke-dashoffset:40}40.75%,100%{stroke-dashoffset:0}}
.c4{stroke-dasharray:40;animation:draw4 8.0s infinite}
@keyframes pop5{0%,39.75%{opacity:0;transform:scale(.3)}42.50%{opacity:1;transform:scale(1.12)}44.25%{transform:scale(1)}87.50%{opacity:1;transform:scale(1)}93.75%,100%{opacity:0;transform:scale(.9)}}
.r5{animation:pop5 8.0s infinite}
@keyframes shake{0%,44.25%{transform:translateX(0)}45.00%{transform:translateX(-6px)}45.75%{transform:translateX(6px)}46.50%{transform:translateX(-4px)}47.25%{transform:translateX(3px)}48.00%,100%{transform:translateX(0)}}
.shake{animation:shake 8.0s infinite}
@keyframes hog{0%,3.75%{transform:translateY(130px)}11.88%{transform:translateY(-8px)}14.37%{transform:translateY(0)}44.25%{transform:translateY(0)}45.75%{transform:translateY(-14px)}48.00%{transform:translateY(0)}90.00%{transform:translateY(0)}96.25%,100%{transform:translateY(130px)}}
.hog{animation:hog 8.0s infinite}
@keyframes blink{0%,67.50%,70.00%,100%{transform:scaleY(1)}68.75%{transform:scaleY(.1)}}
.eyes{animation:blink 8.0s infinite}
@keyframes stat{0%,49.25%{opacity:0;transform:translateY(6px)}54.25%{opacity:1;transform:translateY(0)}87.50%{opacity:1;transform:translateY(0)}93.75%,100%{opacity:0}}
.stat{animation:stat 8.0s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="burrow"><rect x="-100" y="-200" width="200" height="203"/></clipPath></defs>
<rect width="1200" height="300" rx="16" fill="#faf9f7"/>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#e2e5ea"/>
<text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#0d7377">AGENT RELIABILITY BENCHMARK</text>
<text x="62" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#0f1a2e">Groundhog</text>
<text x="64" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#5b6b7d">Being right once isn’t reliable.</text>
<text x="64" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#5b6b7d">50 medical-evidence tasks · 5 runs each · clean and under injected tool faults</text>
<g class="r r1"><circle cx="760" cy="150" r="28" fill="#0d7377" stroke="#0d7377" stroke-width="3"/><path class="c1" d="M748 150 l8 9 l16 -18" fill="none" stroke="#faf9f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
