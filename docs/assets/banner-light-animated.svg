<text x="844" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5b6b7d">run 2</text>
<g class="r r3"><circle cx="928" cy="150" r="28" fill="#0d7377" stroke="#0d7377" stroke-width="3"/><path class="c3" d="M916 150 l8 9 l16 -18" fill="none" stroke="#faf9f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="928" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5b6b7d">run 3</text>
<g class="r r4"><circle cx="1012" cy="150" r="28" fill="#0d7377" stroke="#0d7377" stroke-width="3"/><path class="c4" d="M1000 150 l8 9 l16 -18" fill="none" stroke="#faf9f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1012" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5b6b7d">run 4</text>
<g class="shake"><g class="r r5"><circle cx="1096" cy="150" r="28" fill="none" stroke="#b4475a" stroke-width="3"/><path d="M1087 141 l18 18 M1105 141 l-18 18" fill="none" stroke="#b4475a" stroke-width="4" stroke-linecap="round"/></g></g>
<text x="1096" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5b6b7d">run 5</text>
<text class="stat" x="928" y="252" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#0f1a2e">pass@1 = 0.80 · pass^5 = 0</text>
<g transform="translate(548 200)" aria-hidden="true">
  <ellipse cx="0" cy="2" rx="82" ry="15" fill="#e6dfd2"/>
  <ellipse cx="0" cy="0" rx="52" ry="9" fill="#3b3128"/>
