  <path d="M-44 2 C-50 -34 -44 -62 -30 -76 L30 -76 C44 -62 50 -34 44 2 Z" fill="#0d7377"/>
  <ellipse cx="0" cy="-30" rx="25" ry="30" fill="#f3efe6"/>
  <circle cx="-27" cy="-110" r="6.5" fill="#0a5c5f"/><circle cx="27" cy="-110" r="6.5" fill="#0a5c5f"/>
  <ellipse cx="0" cy="-92" rx="36" ry="27" fill="#0d7377"/>
  <ellipse cx="0" cy="-81" rx="16" ry="11" fill="#f3efe6"/>
  <g class="eyes"><circle cx="-14" cy="-98" r="4.2" fill="#0f1a2e"/><circle cx="14" cy="-98" r="4.2" fill="#0f1a2e"/>
  <circle cx="-12.6" cy="-99.6" r="1.4" fill="#ffffff"/><circle cx="15.4" cy="-99.6" r="1.4" fill="#ffffff"/></g>
  <ellipse cx="0" cy="-87" rx="5.5" ry="3.8" fill="#0f1a2e"/>
  <path d="M-3.5 -77 h7 v6 a1.5 1.5 0 0 1 -1.5 1.5 h-4 a1.5 1.5 0 0 1 -1.5 -1.5 Z" fill="#ffffff" stroke="#0f1a2e" stroke-width="0.8"/>
  <path d="M-17 -84 L-34 -88 M-17 -80 L-34 -79 M17 -84 L34 -88 M17 -80 L34 -79" stroke="#0f1a2e" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="-13" cy="-50" rx="8" ry="5.5" fill="#0a5c5f"/>
  <ellipse cx="13" cy="-50" rx="8" ry="5.5" fill="#0a5c5f"/>
  </g></g>
  <path d="M-82 2 A82 15 0 0 0 82 2 L52 2 A52 9 0 0 1 -52 2 Z" fill="#e6dfd2"/>
