name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tasks against the schema
        run: make validate
      - name: Offline tests
        run: make test
      - name: Quick start (replay, no API keys)
        run: make quickstart
      - name: Gold answers pass their own scorers
        run: make selfcheck
